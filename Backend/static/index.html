<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مُحاوِر</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <h1>مُحاوِر</h1>

    <p class="subtitle">
        تدرّب قبل أن تُحاور
    </p>


    <div class="person">

        <div class="avatar">
            👤
        </div>

        <h2>آدم</h2>

        <p>
            شخص فضولي يريد أن يتعرّف أكثر على الإسلام
        </p>

    </div>


    <div id="conversation">

        <div class="adam-message">
            مرحباً! لدي بعض الأسئلة التي كنت دائماً
            أريد أن أسأل عنها حول الإسلام.
        </div>

    </div>


    <button id="micButton">

        🎙️
        <span id="buttonText">
            اضغط للتحدث
        </span>

    </button>


    <p id="status"></p>

</div>


<script src="app.js"></script>

</body>

</html>
